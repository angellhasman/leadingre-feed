name: Update LeadingRE XML Feed

on:
  workflow_dispatch:
  schedule:
    # GitHub scheduled jobs can be delayed under load. Run several times
    # through the Vancouver evening so at least one fresh snapshot is
    # normally published before LeadingRE's overnight processing window.
    - cron: "17 16 * * *"
      timezone: "America/Vancouver"
    - cron: "17 18 * * *"
      timezone: "America/Vancouver"
    - cron: "17 20 * * *"
      timezone: "America/Vancouver"
    - cron: "17 22 * * *"
      timezone: "America/Vancouver"
    - cron: "17 0 * * *"
      timezone: "America/Vancouver"

permissions:
  contents: write

concurrency:
  group: leadingre-feed-update
  cancel-in-progress: false

jobs:
  update-feed:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check requests beautifulsoup4 lxml

      - name: Generate and audit LeadingRE feed
        run: python generate_feed.py

      - name: Commit refreshed feed and audit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add leadingre.xml feed-audit.txt
          git commit -m "Refresh LeadingRE feed" || exit 0

          for attempt in 1 2 3; do
            # Rebase onto any repository changes made while this job was running
            # (for example, a manual override or workflow maintenance commit).
            if git pull --rebase origin main && git push; then
              exit 0
            fi
            git rebase --abort 2>/dev/null || true
            echo "Publish attempt $attempt failed; retrying shortly..."
            sleep 10
          done

          echo "Unable to push refreshed feed after 3 attempts."
          exit 1
