name: Update LeadingRE XML Feed

on:
  workflow_dispatch:
  schedule:
    # LeadingRE recommends the completed file around 2:00-3:00 AM Central.
    # 12:30 AM Vancouver time is normally 2:30 AM Central.
    - cron: "30 0 * * *"
      timezone: "America/Vancouver"

permissions:
  contents: write

jobs:
  update-feed:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install scraper dependencies
        run: python -m pip install --disable-pip-version-check requests beautifulsoup4 lxml

      - name: Generate LeadingRE XML
        run: python generate_feed.py

      - name: Commit refreshed XML
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add leadingre.xml
          git commit -m "Refresh LeadingRE feed" || exit 0
          git push
